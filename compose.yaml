name: slotwell-m1

services:
  postgres:
    image: docker.io/library/postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    restart: "no"
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: slotwell_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env.local}
      TEST_DB_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD in .env.local}
    volumes:
      - pg18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "slotwell_admin", "-d", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  pg18-data:
    name: slotwell-m1-pg18-data
    labels:
      dev.slotwell.project: slotwell-m1
      dev.slotwell.purpose: local-development-and-test-postgresql18
